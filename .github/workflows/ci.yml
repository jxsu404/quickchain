name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contrato:
    name: Contrato (test + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p budget
        run: cargo test -p budget
      - name: wasm
        run: cargo build -p budget --target wasm32v1-none --release

  typescript:
    name: TypeScript y docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm docs:links
        run: pnpm docs:links
