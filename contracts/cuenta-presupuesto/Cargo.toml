[package]
name = "cuenta-presupuesto"
version = "0.2.0"
edition = "2021"
publish = false
description = "QuickChain: cuenta-presupuesto (cuenta-contrato Soroban con tope mensual para un agente de IA)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22"

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }
ed25519-dalek = "2"
