# Blueprint de Render para el vendedor demo (api-demo/servidor/vendedor.ts). Ver docs/deploy-api.md.
services:
  - type: web
    name: quickchain-api-demo
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter api-demo...
    startCommand: pnpm --filter api-demo vendedor
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: X402_PAY_TO
        sync: false
      - key: X402_FACILITATOR_URL
        value: https://x402.org/facilitator
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
